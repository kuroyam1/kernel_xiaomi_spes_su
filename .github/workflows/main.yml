# A simple action usage
name: Build Kernel spes 4.19 BPF KSUN
on:
  workflow_dispatch:
  push:
    branches:
      - bksu

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel spes 4.19 BPF KSUN
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/kuroyam1/kernel_xiaomi_spes_su
          kernel-dir: msm-4.19
          kernel-branch: bksu
          config: vendor/spes-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu-other: false
          ksu-url: 
          aosp-clang-version: r596125
          anykernel3: true
          anykernel3-url: https://github.com/muralivijay/AnyKernel3
          extra-cmd: LLVM=1 LLVM_IAS=1
